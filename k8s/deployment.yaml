apiVersion: apps/v1
kind: Deployment
metadata:
  name: computer-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: computer-store
  template:
    metadata:
      labels:
        app: computer-store
    spec:
      containers:
        - name: app
          image: computer-store:latest
          ports:
            - containerPort: 8080