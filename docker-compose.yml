version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: computer-store-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: computerstore
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - computer-store-network

  app:
    build: .
    container_name: computer-store-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/computerstore?authSource=admin
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - mongodb
    networks:
      - computer-store-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

networks:
  computer-store-network:
    driver: bridge